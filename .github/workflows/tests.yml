name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Függőségek
        run: pip install -r requirements-dev.txt pip-audit
      - name: Tesztek
        run: python -m unittest discover -s tests -v
      - name: Függőség-audit
        run: pip-audit -r requirements.txt
