name: Hibajelentés
description: Nem várt viselkedés vagy hiba jelentése
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Ne küldj tokent, nyugta-PDF-et, vásárlási adatot vagy jelszót.**
        A hibát szintetikus adatokkal próbáld reprodukálni.
  - type: input
    id: version
    attributes:
      label: Verzió
      description: A kiadás vagy commit (pl. v2.0.0)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Futtatási mód
      options:
        - Windows (helyi)
        - Docker
        - Egyéb
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reprodukálás lépései
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Várt és tényleges viselkedés
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Releváns napló (személyes adat nélkül)
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Adatvédelem
      options:
        - label: Nem küldtem tokent, nyugtát vagy személyes adatot.
          required: true
