services:
  lidl:
    build: .
    image: lidl-receipts:2.0.0
    container_name: lidl
    restart: unless-stopped
    init: true
    environment:
      TZ: Europe/Budapest
      LIDL_DATA_DIR: /data
      LIDL_OUTPUT_DIR: /nyugtak
      LIDL_COUNTRY: HU
      LIDL_LANGUAGE: hu
      LIDL_UI_PASSWORD: ${LIDL_UI_PASSWORD:-}
      LIDL_APP_VERSION: ${LIDL_APP_VERSION:-}
    volumes:
      - ${LIDL_DATA_PATH:-./data}:/data
      - ${LIDL_OUTPUT_PATH:-./nyugtak}:/nyugtak
    ports:
      # Konkrét IP-re kötéshez írd át, pl. 192.0.2.10:8765:8765
      - "${LIDL_BIND:-0.0.0.0}:8765:8765"
    user: "${LIDL_UID:-1000}:${LIDL_GID:-1000}"
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=8).status == 200 else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 25s
